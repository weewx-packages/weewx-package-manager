[project]
name = "weewx-package-manager"
version = "0.1.0a1"
description = "Repository package manager for WeeWX"
requires-python = ">=3.10"
dependencies = ["weewx>=5.5.2,<6", "packaging>=21"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
weectl-packages = "user.packages.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["bin"]
include = ["user.packages*"]

[tool.pytest.ini_options]
pythonpath = ["bin"]
testpaths = ["tests"]
